name: Verify generated NoneBot farm
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python verify_package.py --directory .
      - run: python -m pip install build
      - run: python -m build --sdist --wheel --outdir ../packages
      - uses: actions/upload-artifact@v7
        with:
          name: nonebot-distributions
          path: ../packages/*
          if-no-files-found: error
